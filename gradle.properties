# Gradle 全局配置
# 注意：不要在这里写死 http/https 代理，换机器会导致 Gradle 卡死或解析依赖失败。
# 如确需代理，请改用 ~/.gradle/gradle.properties（只对本机生效，不进版本库）。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# AGP 9 说明：
#   android.useAndroidX     → AGP 9 起默认 true，再显式设置会被视为遗留 flag，已移除
#   android.enableJetifier  → AGP 9 起默认 false 且已废弃，已移除
#   android.suppressUnsupportedCompileSdk=37 → AGP 9.1.1+ 原生支持 API 37，不再需要
# ---------------------------------------------------------------------------
